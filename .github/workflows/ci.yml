name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: ruff check --output-format=github .
      - name: Tests
        run: |
          set -o pipefail
          pytest -q --tb=short -rfE 2>&1 | tee pytest.log
      - name: Surface test failures as annotations
        if: failure()
        run: |
          python - <<'EOF'
          lines = open("pytest.log").read().splitlines()[-80:]
          body = "%0A".join(l.replace("%", "%25") for l in lines)
          print(f"::error title=pytest::{body}")
          EOF
